name: ML CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-train:
     runs-on: ubuntu-latest
     steps:
       -name: Checkout code
        uses: actions/checkout@v4

       -name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

       -name: Install dependencies
        run: |
          pip install -r requirements.txt
      
       -name: Run training script
        run: |
          python lesson1_mlflow.py

       -name: Check results
        run: |
          echo "Model training completed successfully."
